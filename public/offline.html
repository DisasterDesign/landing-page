<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>אין חיבור — Fuzion Webz</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Heebo', system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e5e7eb;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 12px;
      }
      p {
        margin: 0 0 20px;
        color: #94a3b8;
        line-height: 1.6;
      }
      button {
        background: #e503a2;
        color: #fff;
        border: 0;
        padding: 12px 28px;
        border-radius: 999px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover {
        background: #f04bb9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>אין חיבור לאינטרנט</h1>
      <p>נראה שאין לך כרגע חיבור פעיל. בדוק את החיבור ונסה שוב.</p>
      <button onclick="location.reload()">נסה שוב</button>
    </div>
  </body>
</html>
